spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  main:
    allow-bean-definition-overriding: true

  jpa:
    hibernate:
      ddl-auto: update
    show_sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_URL}
      port: 6379

springdoc:
  swagger-ui:
    path: /reservation/swagger-ui
    display-request-duration: true
  api-docs:
    path: /reservation/docs

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: prometheus
  metrics:
    tags:
      application: service # add tag to each prometheus metric
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: 'true'
      minimum-expected-value: # Publish fewer histogram buckets by clamping the range of expected values.
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 1000ms

logging:
  pattern:
    level: "trace_id=%mdc{trace_id} span_id=%mdc{span_id} trace_flags=%mdc{trace_flags} %p"
  level:
    org.meme.service: DEBUG