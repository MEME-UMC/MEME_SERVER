spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  main:
    allow-bean-definition-overriding: true

  jpa:
    hibernate:
      ddl-auto: update
    show_sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_URL}
      port: 6379

  security:
    oauth2:
      kakao:
        issuer: "https://kauth.kakao.com"
        rest-api-key: ${KAKAO_REST_API_KEY}
      apple:
        issuer: "https://appleid.apple.com"
        client-id: ${APPLE_CLIENT_ID}

jwt:
  issuer: meme_umc
  secret-key: ${JWT_SECRET_KEY}
  access-token-validity-in-seconds: 1800  # 30 minutes
  refresh-token-validity-in-seconds: 86400  # 24 hours

springdoc:
  swagger-ui:
    path: /auth/swagger-ui
    display-request-duration: true
  api-docs:
    path: /auth/docs

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: prometheus
  metrics:
    tags:
      application: service # add tag to each prometheus metric
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: 'true'
      minimum-expected-value: # Publish fewer histogram buckets by clamping the range of expected values.
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 1000ms

logging:
  pattern:
    level: "trace_id=%mdc{trace_id} span_id=%mdc{span_id} trace_flags=%mdc{trace_flags} %p"
  level:
    org.meme.service: DEBUG